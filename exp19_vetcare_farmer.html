<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exp 19 - Livestock Vet Consultation</title>
<style>
*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#fffbeb;color:#222}
header{background:#b45309;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button{background:#fff;color:#b45309;border:0;padding:7px 12px;border-radius:6px;cursor:pointer}
main{max-width:1050px;margin:16px auto;padding:0 12px}
.card{background:#fff;border-radius:10px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0002}
input,select,textarea{padding:8px;margin:4px 4px 4px 0;border:1px solid #ccc;border-radius:6px}
button.p{background:#b45309;color:#fff;border:0;padding:7px 12px;border-radius:6px;cursor:pointer;margin:2px}button.d{background:#dc2626}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #eee;padding:6px;text-align:left;font-size:14px;vertical-align:top}
.msg{color:#b91c1c}.tag{background:#fef3c7;padding:2px 8px;border-radius:10px;font-size:12px}.bar{background:#b45309;color:#fff;padding:3px 8px;border-radius:4px;display:inline-block;white-space:nowrap}
img.m,video.m{max-width:200px;border-radius:6px}.news{border-left:4px solid #b45309;padding:6px 10px;margin:8px 0;background:#fffbeb}
</style></head><body>
<header><h2>🐄 Livestock Vet Consultation</h2><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},S=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),$=id=>document.getElementById(id),V=id=>$(id).value.trim();
let users=L('vc_u',[{u:'farmer1',p:'1234',name:'Ramesh',area:'Madurai',phone:'9000000033',sub:'Govt CVH'}]);
let docs=L('vc_d',[{u:'doc1',p:'1234',name:'Dr. Selvi',type:'Govt CVH',clinic:'Govt Veterinary Hospital',bank:'SBI 1234567890',easypaisa:'0300-1112223'}]);
let cures=L('vc_cure',[{id:1,disease:'Foot and Mouth Disease',animal:'Cow',symptoms:'Fever, blisters on mouth and hooves, drooling',cure:'Isolate animal, antiseptic wash, soft feed, vaccination of herd. Consult vet for antibiotics.'},{id:2,disease:'Mastitis',animal:'Cow / Buffalo',symptoms:'Swollen udder, clotted milk',cure:'Intramammary antibiotic as prescribed, frequent milking, udder hygiene.'},{id:3,disease:'Newcastle Disease',animal:'Poultry',symptoms:'Gasping, twisted neck, greenish droppings',cure:'No cure; vaccinate flock, isolate sick birds, supportive care.'}]);
let news=L('vc_news',[{id:1,title:'Free FMD vaccination camp',text:'Govt CVH is conducting a free vaccination drive this month.',by:'Dr. Selvi',time:new Date().toLocaleDateString()}]);
let cmps=L('vc_c',[]),pays=L('vc_pay',[]),fbs=L('vc_fb',[]),sess=L('vc_sess',null),page='home';
const save=()=>{S('vc_u',users);S('vc_d',docs);S('vc_cure',cures);S('vc_news',news);S('vc_c',cmps);S('vc_pay',pays);S('vc_fb',fbs);S('vc_sess',sess)};
const me=()=>(sess.role==='user'?users:docs).find(x=>x.u===sess.id);
function go(p){page=p;render()}
function render(){
 let n='<button onclick="go(\'home\')">Home</button>';
 if(!sess)n+='<button onclick="go(\'ureg\')">Farmer Register</button><button onclick="go(\'ulogin\')">Farmer Login</button><button onclick="go(\'dreg\')">Doctor Register</button><button onclick="go(\'dlogin\')">Doctor Login</button>';
 else if(sess.role==='user')n+=['post:Post Complaint','mine:My Complaints','cure:Vetcure Details','news:News','doctors:View Doctors','report:Disease Report','pay:Make Payment','fb:Feedback','prof:My Profile'].map(x=>{const[a,b]=x.split(':');return`<button onclick="go('${a}')">${b}</button>`}).join('');
 else n+=['dcmp:View Complaints','dcure:Manage Cure','dnews:Manage News','dusers:User Details','dpay:Payment Details','dfb:Feedback Details','report:Disease Report'].map(x=>{const[a,b]=x.split(':');return`<button onclick="go('${a}')">${b}</button>`}).join('');
 if(sess)n+=`<button onclick="sess=null;save();go('home')">Logout (${sess.name})</button>`;
 $('nav').innerHTML=n;$('app').innerHTML=pages[page]();
}
const lg=(t,fn)=>`<div class="card"><h3>${t}</h3><p><small>Demo: farmer1 / 1234 · doc1 / 1234</small></p><input id="lu" placeholder="Username"><input id="lp" type="password" placeholder="Password"><button class="p" onclick="${fn}()">Login</button><div id="lm" class="msg"></div></div>`;
const media=c=>c.media?(c.mtype.startsWith('image')?`<img class="m" src="${c.media}">`:c.mtype.startsWith('video')?`<video class="m" controls src="${c.media}"></video>`:c.mtype.startsWith('audio')?`<audio controls src="${c.media}"></audio>`:''):'';
const pages={
home:()=>`<div class="card"><h2>Send your animal's symptoms to a veterinary doctor</h2><p>Farmers register, subscribe (free for Govt CVH, paid for private clinics), and send symptoms as text, image, audio or video. Doctors reply with a solution. The system analyses which diseases occur most in each area.</p></div><div class="card"><h3>Latest news</h3>${news.map(n=>`<div class="news"><b>${n.title}</b><br>${n.text}</div>`).join('')}</div>`,
ulogin:()=>lg('Farmer Login','userLogin'),dlogin:()=>lg('Doctor Login','docLogin'),
ureg:()=>`<div class="card"><h3>Farmer Registration</h3><input id="n" placeholder="Name"><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><input id="ph" placeholder="Mobile"><input id="a" placeholder="Area / Village"><br>Subscribe to: <select id="s">${['Govt CVH (free)',...docs.filter(d=>d.type==='Private').map(d=>d.name+' (private, fee ₹500)')].map(x=>`<option>${x}</option>`).join('')}</select><button class="p" onclick="regUser()">Register</button><div id="lm" class="msg"></div></div>`,
dreg:()=>`<div class="card"><h3>Doctor Registration</h3><input id="n" placeholder="Doctor name"><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><select id="t"><option>Govt CVH</option><option>Private</option></select><input id="c" placeholder="Clinic"><br><input id="b" placeholder="Bank details" size="30"><input id="e" placeholder="EasyPaisa account (optional)"><button class="p" onclick="regDoc()">Register</button><div id="lm" class="msg"></div></div>`,
post:()=>`<div class="card"><h3>Post complaint</h3><select id="an"><option>Cow</option><option>Buffalo</option><option>Goat</option><option>Sheep</option><option>Poultry</option></select><input id="ds" placeholder="Disease suspected (optional)"><br><textarea id="tx" rows="4" cols="50" placeholder="Describe signs & symptoms"></textarea><br>Attach photo / audio / video: <input type="file" id="fl" accept="image/*,audio/*,video/*"><br><button class="p" onclick="postCmp()">Send to doctor</button><div id="lm" class="msg"></div></div>`,
mine:()=>`<div class="card"><h3>My complaint status</h3><table><tr><th>ID</th><th>Animal</th><th>Details</th><th>Status</th><th>Doctor's solution</th></tr>${cmps.filter(c=>c.by===sess.id).map(c=>`<tr><td>${c.id}</td><td>${c.animal}</td><td>${c.text}<br>${media(c)}</td><td><span class="tag">${c.sol?'Answered':'Pending'}</span></td><td>${c.sol||'-'}</td></tr>`).join('')||'<tr><td colspan=5>No complaints</td></tr>'}</table></div>`,
cure:()=>`<div class="card"><h3>Vetcure details — common diseases & prescriptions</h3>${cures.map(c=>`<div class="news"><b>${c.disease}</b> (${c.animal})<br><b>Symptoms:</b> ${c.symptoms}<br><b>Cure:</b> ${c.cure}</div>`).join('')}</div>`,
news:()=>`<div class="card"><h3>News</h3>${news.map(n=>`<div class="news"><b>${n.title}</b> <small>${n.time} · ${n.by}</small><br>${n.text}</div>`).join('')}</div>`,
doctors:()=>`<div class="card"><h3>Doctors</h3><table><tr><th>Name</th><th>Type</th><th>Clinic</th><th>Payment info</th></tr>${docs.map(d=>`<tr><td>${d.name}</td><td>${d.type}</td><td>${d.clinic}</td><td>${d.type==='Govt CVH'?'Free':'Bank: '+d.bank+(d.easypaisa?'<br>EasyPaisa: '+d.easypaisa:'')}</td></tr>`).join('')}</table></div>`,
report:()=>{const m={};cmps.forEach(c=>{const a=(users.find(u=>u.u===c.by)||{}).area||'Unknown',d=c.disease||'Unspecified';(m[a]=m[a]||{})[d]=((m[a]||{})[d]||0)+1});
 return`<div class="card"><h3>Disease analysis by area</h3>${Object.keys(m).map(a=>`<h4>📍 ${a}</h4>${Object.entries(m[a]).sort((x,y)=>y[1]-x[1]).map(([d,n],i)=>`<div style="margin:3px 0">${d} <span class="bar" style="width:${n*50}px">${n}</span>${i===0?' ← most common':''}</div>`).join('')}`).join('')||'<p>No complaint data yet.</p>'}</div>`},
pay:()=>`<div class="card"><h3>Make payment to doctor</h3><select id="pd">${docs.filter(d=>d.type==='Private').map(d=>`<option value="${d.u}">${d.name} (${d.clinic})</option>`).join('')}</select><input id="pa" type="number" placeholder="Amount ₹"><select id="pm"><option>Bank transfer</option><option>EasyPaisa</option></select><input id="pr" placeholder="Transaction reference"><button class="p" onclick="makePay()">Submit payment</button><div id="lm" class="msg"></div></div><div class="card"><h3>My payments</h3>${pays.filter(p=>p.by===sess.id).map(p=>`<p>${p.time}: ₹${p.amt} → ${p.doc} via ${p.mode} (${p.ref})</p>`).join('')||'None'}</div>`,
fb:()=>`<div class="card"><h3>Post feedback</h3><select id="fd">${docs.map(d=>`<option value="${d.u}">${d.name}</option>`).join('')}</select><select id="fr"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select> stars<br><textarea id="ft" rows="3" cols="50"></textarea><br><button class="p" onclick="postFb()">Submit</button></div>`,
prof:()=>{const u=me();return`<div class="card"><h3>My profile</h3><p>Name: ${u.name}<br>Mobile: ${u.phone}<br>Area: ${u.area}<br>Subscription: ${u.sub}</p></div>`},
dcmp:()=>`<div class="card"><h3>Complaints from farmers</h3><table><tr><th>ID</th><th>Farmer / area</th><th>Animal & symptoms</th><th>Solution</th></tr>${cmps.map(c=>`<tr><td>${c.id}</td><td>${c.by}<br><small>${(users.find(u=>u.u===c.by)||{}).area||''}</small></td><td>${c.animal}: ${c.text}<br>${media(c)}</td><td>${c.sol?`<b>${c.sol}</b><br><small>by ${c.doc}</small>`:`<textarea id="sol${c.id}" rows="2" cols="28" placeholder="Prescription / advice"></textarea><br><input id="dis${c.id}" placeholder="Diagnosis"><button class="p" onclick="postSol('${c.id}')">Post solution</button>`}</td></tr>`).join('')||'<tr><td colspan=4>No complaints</td></tr>'}</table></div>`,
dcure:()=>`<div class="card"><h3>Manage cure</h3><input id="cd" placeholder="Disease"><input id="ca" placeholder="Animal"><br><input id="cs" placeholder="Symptoms" size="40"><br><input id="cc" placeholder="Cure / prescription" size="40"><button class="p" onclick="addCure()">Add</button></div><div class="card">${cures.map(c=>`<div class="news"><b>${c.disease}</b> (${c.animal}) <button class="p d" onclick="cures=cures.filter(x=>x.id!==${c.id});save();render()">Delete</button><br>${c.cure}</div>`).join('')}</div>`,
dnews:()=>`<div class="card"><h3>Manage news</h3><input id="nt" placeholder="Title" size="30"><br><textarea id="nx" rows="3" cols="50" placeholder="News text"></textarea><br><button class="p" onclick="addNews()">Publish</button></div><div class="card">${news.map(n=>`<div class="news"><b>${n.title}</b> <button class="p d" onclick="news=news.filter(x=>x.id!==${n.id});save();render()">Delete</button><br>${n.text}</div>`).join('')}</div>`,
dusers:()=>`<div class="card"><h3>Farmer details</h3><table><tr><th>Name</th><th>Username</th><th>Mobile</th><th>Area</th><th>Subscription</th></tr>${users.map(u=>`<tr><td>${u.name}</td><td>${u.u}</td><td>${u.phone}</td><td>${u.area}</td><td>${u.sub}</td></tr>`).join('')}</table></div>`,
dpay:()=>`<div class="card"><h3>Payments received</h3><table><tr><th>Time</th><th>Farmer</th><th>Amount</th><th>Mode</th><th>Ref</th></tr>${pays.filter(p=>p.docU===sess.id).map(p=>`<tr><td>${p.time}</td><td>${p.by}</td><td>₹${p.amt}</td><td>${p.mode}</td><td>${p.ref}</td></tr>`).join('')||'<tr><td colspan=5>None</td></tr>'}</table></div>`,
dfb:()=>`<div class="card"><h3>Feedback</h3>${fbs.filter(f=>f.docU===sess.id).map(f=>`<div class="news">${'⭐'.repeat(+f.rate)} <b>${f.by}</b><br>${f.text}</div>`).join('')||'None'}</div>`
};
function regUser(){if(!V('n')||!V('u')||!V('p')){$('lm').textContent='Name, username and password required';return}if(users.find(x=>x.u===V('u'))){$('lm').textContent='Username exists';return}users.push({name:V('n'),u:V('u'),p:$('p').value,phone:V('ph'),area:V('a')||'Unknown',sub:V('s')});save();alert('Registered! '+(V('s').includes('private')?'Please complete the subscription fee under Make Payment.':''));go('ulogin')}
function regDoc(){if(!V('n')||!V('u')||!V('p')){$('lm').textContent='Name, username and password required';return}if(docs.find(x=>x.u===V('u'))){$('lm').textContent='Username exists';return}docs.push({name:V('n'),u:V('u'),p:$('p').value,type:V('t'),clinic:V('c'),bank:V('b'),easypaisa:V('e')});save();alert('Registered');go('dlogin')}
function userLogin(){const u=users.find(x=>x.u===V('lu')&&x.p===$('lp').value);if(!u){$('lm').textContent='Invalid credentials';return}sess={role:'user',id:u.u,name:u.name};save();go('post')}
function docLogin(){const u=docs.find(x=>x.u===V('lu')&&x.p===$('lp').value);if(!u){$('lm').textContent='Invalid credentials';return}sess={role:'doc',id:u.u,name:u.name};save();go('dcmp')}
function postCmp(){if(!V('tx')&&!$('fl').files[0]){$('lm').textContent='Add a description or attach media';return}const f=$('fl').files[0];
 const done=(m,t)=>{cmps.push({id:'V'+(101+cmps.length),by:sess.id,animal:V('an'),disease:V('ds'),text:V('tx')||'(see attachment)',media:m,mtype:t,time:new Date().toLocaleString()});try{save()}catch(e){cmps[cmps.length-1].media='';alert('Attachment too large, sent without media');save()}go('mine')};
 if(f){const r=new FileReader();r.onload=()=>done(r.result,f.type);r.readAsDataURL(f)}else done('','')}
function postSol(id){const c=cmps.find(x=>x.id===id),s=$('sol'+id).value.trim();if(!s)return alert('Enter a solution');c.sol=s;c.doc=sess.name;if($('dis'+id).value.trim())c.disease=$('dis'+id).value.trim();save();render()}
function addCure(){if(!V('cd')||!V('cc'))return;cures.push({id:Date.now(),disease:V('cd'),animal:V('ca'),symptoms:V('cs'),cure:V('cc')});save();render()}
function addNews(){if(!V('nt'))return;news.unshift({id:Date.now(),title:V('nt'),text:V('nx'),by:sess.name,time:new Date().toLocaleDateString()});save();render()}
function makePay(){if(!V('pd')||!V('pa')||!V('pr')){$('lm').textContent='Select doctor, amount and reference';return}const d=docs.find(x=>x.u===V('pd'));pays.push({by:sess.id,docU:d.u,doc:d.name,amt:V('pa'),mode:V('pm'),ref:V('pr'),time:new Date().toLocaleString()});save();alert('Payment recorded. Doctor bank: '+d.bank+(d.easypaisa?' | EasyPaisa: '+d.easypaisa:''));render()}
function postFb(){fbs.push({by:sess.id,docU:V('fd'),rate:V('fr'),text:V('ft'),time:new Date().toLocaleString()});save();alert('Thanks for your feedback');render()}
render();
</script></body></html>
