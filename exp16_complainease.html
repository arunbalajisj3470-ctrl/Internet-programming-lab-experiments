<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exp 16 - ComplainEase</title>
<style>
*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f8fafc;color:#222}
header{background:#7c3aed;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button{background:#fff;color:#7c3aed;border:0;padding:7px 12px;border-radius:6px;cursor:pointer}
main{max-width:1050px;margin:16px auto;padding:0 12px}
.card{background:#fff;border-radius:10px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0002}
input,select,textarea{padding:8px;margin:4px 4px 4px 0;border:1px solid #ccc;border-radius:6px}
button.p{background:#7c3aed;color:#fff;border:0;padding:7px 12px;border-radius:6px;cursor:pointer;margin:2px}button.d{background:#dc2626}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #eee;padding:6px;text-align:left;font-size:14px;vertical-align:top}
.msg{color:#b91c1c}.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:#ede9fe}iframe{width:100%;height:240px;border:0;border-radius:8px}img.pf{max-width:140px;border-radius:6px}
</style></head><body>
<header><h2>📢 ComplainEase</h2><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},S=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),$=id=>document.getElementById(id),V=id=>$(id).value.trim();
let users=L('ce_users',[]),officers=L('ce_off',[]),cmps=L('ce_cmp',[]),hidden=L('ce_hide',[]),sess=L('ce_sess',null),page='home';
const ADMIN={phone:'044-2345-6789',email:'admin@complainease.in',office:'Collectorate, Main Road'};
const FEATS=['Feedback','Admin contact details','Location marking'];
const save=()=>{S('ce_users',users);S('ce_off',officers);S('ce_cmp',cmps);S('ce_hide',hidden);S('ce_sess',sess)};
const hid=f=>hidden.includes(f);
function go(p){page=p;render()}
function render(){
 let n='<button onclick="go(\'home\')">Home</button>';
 if(!sess)n+='<button onclick="go(\'ureg\')">User Register</button><button onclick="go(\'ulogin\')">User Login</button><button onclick="go(\'oreg\')">Officer Register</button><button onclick="go(\'ologin\')">Officer Login</button><button onclick="go(\'alogin\')">Admin</button>';
 else if(sess.role==='user')n+='<button onclick="go(\'post\')">Post Complaint</button><button onclick="go(\'status\')">My Complaints</button>'+(hid('Feedback')?'':'<button onclick="go(\'fb\')">Feedback</button>')+(hid('Admin contact details')?'':'<button onclick="go(\'contact\')">Admin Contact</button>');
 else if(sess.role==='officer')n+='<button onclick="go(\'ocmp\')">View Complaints</button>';
 else n+='<button onclick="go(\'aoff\')">Officers</button><button onclick="go(\'ausers\')">User Accounts</button><button onclick="go(\'acmp\')">All Complaints</button><button onclick="go(\'afeat\')">Features</button>';
 if(sess)n+=`<button onclick="sess=null;save();go('home')">Logout (${sess.name})</button>`;
 $('nav').innerHTML=n;$('app').innerHTML=pages[page]();
}
const lg=(t,fn,h='')=>`<div class="card"><h3>${t}</h3>${h}<input id="lu" placeholder="Username / ID"><input id="lp" type="password" placeholder="Password"><button class="p" onclick="${fn}()">Login</button><div id="lm" class="msg"></div></div>`;
const cmpTable=(list,mode)=>`<table><tr><th>ID</th><th>Category</th><th>Details</th><th>Location</th><th>Status</th>${mode==='off'?'<th>Action</th>':''}${mode==='user'?'<th>Officer reply / proof</th>':''}</tr>${list.map(c=>`<tr><td>${c.id}</td><td>${c.cat}<br><small>${c.by}</small></td><td>${c.desc}<br><small>${c.time}</small></td><td>${c.loc||'-'}</td><td><span class="tag">${c.status}</span></td>${mode==='off'?`<td><select onchange="setStatus('${c.id}',this.value)">${['Registered','In progress','Resolved','Rejected'].map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select><br><input type="file" accept="image/*" onchange="proof('${c.id}',this)"></td>`:''}${mode==='user'?`<td>${c.proof?`<img class="pf" src="${c.proof}"><br>`:''}${c.fb?'Your feedback: '+c.fb:''}</td>`:''}</tr>`).join('')||'<tr><td colspan=7>No complaints</td></tr>'}</table>`;
const pages={
home:()=>`<div class="card"><h2>Register and track your complaints transparently</h2><p>Citizens post complaints with a location on the map. Officers (assigned by the admin) update status and upload proof of work.</p><p><small>Demo admin: admin / admin123</small></p></div>`,
ulogin:()=>lg('User Login','userLogin'),ologin:()=>lg('Officer Login','offLogin','<p><small>Use the ID and password generated by the admin.</small></p>'),alogin:()=>lg('Admin Login','adminLogin'),
ureg:()=>`<div class="card"><h3>User Registration</h3><input id="n" placeholder="Name"><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><input id="ph" placeholder="Phone"><button class="p" onclick="regUser()">Register</button><div id="lm" class="msg"></div></div>`,
oreg:()=>`<div class="card"><h3>Officer Registration Request</h3><p>Submit your details. The admin will generate your login ID and password.</p><input id="n" placeholder="Name"><input id="ph" placeholder="Phone"><input id="d" placeholder="Department"><button class="p" onclick="regOff()">Submit request</button><div id="lm" class="msg"></div></div>`,
post:()=>`<div class="card"><h3>Post complaint</h3><select id="c"><option>Roads</option><option>Water supply</option><option>Electricity</option><option>Sanitation</option><option>Other</option></select><br><textarea id="d" rows="4" cols="50" placeholder="Describe the issue"></textarea><br>${hid('Location marking')?'':`<input id="l" placeholder="Location / address / lat,lng" size="40"><button class="p" onclick="showMap()">📍 Mark in Google Map</button><button class="p" onclick="myLoc()">Use my location</button><div id="map"></div>`}<br><button class="p" onclick="postCmp()">Submit complaint</button><div id="lm" class="msg"></div></div>`,
status:()=>`<div class="card"><h3>My complaint status</h3>${cmpTable(cmps.filter(c=>c.by===sess.id),'user')}</div>`,
fb:()=>`<div class="card"><h3>Feedback</h3><select id="fc">${cmps.filter(c=>c.by===sess.id).map(c=>`<option>${c.id}</option>`).join('')}</select><br><textarea id="ft" rows="3" cols="50" placeholder="How was the resolution?"></textarea><br><button class="p" onclick="giveFb()">Send</button></div>`,
contact:()=>`<div class="card"><h3>Admin contact</h3><p>📞 ${ADMIN.phone}<br>✉ ${ADMIN.email}<br>🏢 ${ADMIN.office}</p></div>`,
ocmp:()=>`<div class="card"><h3>Complaints (${sess.dept||'all'})</h3>${cmpTable(cmps,'off')}</div>`,
aoff:()=>`<div class="card"><h3>Officer requests & accounts</h3><table><tr><th>Name</th><th>Dept</th><th>Phone</th><th>Login ID</th><th>Password</th><th></th></tr>${officers.map((o,i)=>`<tr><td>${o.name}</td><td>${o.dept}</td><td>${o.phone}</td><td>${o.id||'<i>not generated</i>'}</td><td>${o.pass||''}</td><td>${o.id?`<button class="p" onclick="chPass('o',${i})">Change password</button>`:`<button class="p" onclick="genCred(${i})">Generate ID & password</button>`}<button class="p d" onclick="officers.splice(${i},1);save();render()">Delete</button></td></tr>`).join('')||'<tr><td colspan=6>No officers</td></tr>'}</table></div>`,
ausers:()=>`<div class="card"><h3>User accounts</h3><table><tr><th>Name</th><th>Username</th><th>Phone</th><th></th></tr>${users.map((u,i)=>`<tr><td>${u.name}</td><td>${u.u}</td><td>${u.phone}</td><td><button class="p" onclick="chPass('u',${i})">Change password</button><button class="p d" onclick="users.splice(${i},1);save();render()">Delete account</button></td></tr>`).join('')||'<tr><td colspan=4>None</td></tr>'}</table></div>`,
acmp:()=>`<div class="card"><h3>All complaints</h3>${cmpTable(cmps,'')}<p><b>Feedback received:</b></p>${cmps.filter(c=>c.fb).map(c=>`<p>${c.id}: ${c.fb}</p>`).join('')||'None'}</div>`,
afeat:()=>`<div class="card"><h3>Show / hide features for users</h3>${FEATS.map(f=>`<label><input type="checkbox" ${hid(f)?'':'checked'} onchange="toggleFeat('${f}')"> ${f} visible</label><br>`).join('')}</div>`
};
function adminLogin(){if(V('lu')==='admin'&&$('lp').value==='admin123'){sess={role:'admin',id:'admin',name:'Admin'};save();go('aoff')}else $('lm').textContent='Invalid credentials'}
function userLogin(){const u=users.find(x=>x.u===V('lu')&&x.p===$('lp').value);if(!u){$('lm').textContent='Invalid credentials';return}sess={role:'user',id:u.u,name:u.name};save();go('post')}
function offLogin(){const o=officers.find(x=>x.id&&x.id===V('lu')&&x.pass===$('lp').value);if(!o){$('lm').textContent='Invalid ID/password (or not yet approved)';return}sess={role:'officer',id:o.id,name:o.name,dept:o.dept};save();go('ocmp')}
function regUser(){if(!V('n')||!V('u')||!V('p')){$('lm').textContent='Name, username and password required';return}if(users.find(x=>x.u===V('u'))){$('lm').textContent='Username taken';return}users.push({name:V('n'),u:V('u'),p:$('p').value,phone:V('ph')});save();alert('Registered');go('ulogin')}
function regOff(){if(!V('n'))return;officers.push({name:V('n'),phone:V('ph'),dept:V('d')});save();alert('Request submitted. Admin will share your ID & password.');go('home')}
function genCred(i){const o=officers[i];o.id='OFF'+(100+i+Math.floor(Math.random()*900));o.pass=Math.random().toString(36).slice(2,8);save();render()}
function chPass(t,i){const p=prompt('New password');if(!p)return;(t==='o'?officers:users)[i][t==='o'?'pass':'p']=p;save();render()}
function toggleFeat(f){hidden=hid(f)?hidden.filter(x=>x!==f):[...hidden,f];save()}
function mapUrl(q){return'https://maps.google.com/maps?q='+encodeURIComponent(q)+'&z=15&output=embed'}
function showMap(){if(!V('l'))return alert('Enter a location');$('map').innerHTML=`<iframe src="${mapUrl(V('l'))}"></iframe>`}
function myLoc(){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{$('l').value=p.coords.latitude.toFixed(5)+','+p.coords.longitude.toFixed(5);showMap()},()=>alert('Location permission denied')):alert('Geolocation unsupported')}
function postCmp(){if(!V('d')){$('lm').textContent='Please describe the complaint';return}cmps.push({id:'C'+(1001+cmps.length),by:sess.id,cat:V('c'),desc:V('d'),loc:$('l')?V('l'):'',status:'Registered',time:new Date().toLocaleString()});save();alert('Complaint registered');go('status')}
function setStatus(id,s){cmps.find(c=>c.id===id).status=s;save()}
function proof(id,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{cmps.find(c=>c.id===id).proof=r.result;save();alert('Proof of work uploaded');render()};r.readAsDataURL(f)}
function giveFb(){const c=cmps.find(x=>x.id===V('fc'));if(!c)return alert('No complaint to give feedback on');c.fb=V('ft');save();alert('Thanks for your feedback');go('status')}
render();
</script></body></html>
